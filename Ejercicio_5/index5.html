<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 5 - Network-First + IndexedDB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1> Network-First + IndexedDB</h1>

    <div class="card status-card">
      <p>Estado de red: <span id="network-status">Detectando...</span></p>
      <p>Fuente de datos: <span id="data-source">—</span></p>
    </div>

    <div class="card">
      <h2>Cargar usuarios (API)</h2>
      <button id="btn-load">Cargar datos</button>
      <p class="hint">Primero intenta la red. Si falla, usa IndexedDB.</p>
    </div>

    <div class="card">
      <h2>Resultados</h2>
      <div id="loading" class="hidden">Cargando...</div>
      <ul id="lista"></ul>
      <p id="empty-msg" class="empty">Aún no hay datos.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
