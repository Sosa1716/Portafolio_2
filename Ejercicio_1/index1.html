<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1 - Permisos y Geolocalización</title>
  
  <!-- Leaflet CSS (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Permisos y Geolocalización</h1>

    <div class="card">
      <h2>Estado del permiso</h2>
      <p id="permission-status">Consultando...</p>
      <button id="btn-check-permission">Verificar permiso</button>
    </div>

    <div class="card">
      <h2>Obtener ubicación</h2>
      <button id="btn-get-location">Solicitar ubicación</button>
      
      <div id="location-info" class="hidden">
        <p><strong>Latitud:</strong> <span id="lat"></span></p>
        <p><strong>Longitud:</strong> <span id="lng"></span></p>
        <p><strong>Precisión:</strong> <span id="accuracy"></span> metros</p>
      </div>
    </div>

    <div class="card">
      <h2>Mapa</h2>
      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
